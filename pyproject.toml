[project]
name = "scrawl"
version = "0.1.0"
description = "A tiny, fast notepad for brain dumps and to-do lists, with a global hotkey."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jake Derkowski" }]
# No runtime dependencies on purpose: Tkinter, ctypes, and winreg ship with
# CPython, which keeps the app small and the install trivial.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
scrawl = "scrawl.cli:main"

# A gui-script gets a launcher with no console window, which is what the
# start-at-login entry and desktop shortcuts should use.
[project.gui-scripts]
scrawl-gui = "scrawl.cli:gui_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrawl"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplification
    "PTH",       # use pathlib
    "RET",       # return consistency
    "ARG",       # unused arguments
    "S",         # bandit security rules
    "T20",       # no print
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG"]
"src/*/cli.py" = ["T20"]
# Operational scripts print results and launch the app under test.
"scripts/*" = ["T20", "S603", "S101"]
# ctypes struct fields and Win32 callback signatures follow the Windows API's
# own naming, and unused callback arguments are dictated by the signature.
"src/*/win32.py" = ["N801", "N802", "N803", "N815", "N816"]
"src/*/shell.py" = ["ARG002", "N802", "N803", "N815"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=scrawl --cov-report=term-missing"

[tool.coverage.run]
# The Win32 shell and the Tk window need a real desktop session; they are
# exercised by the smoke checks in docs/operations.md rather than unit tests.
omit = ["src/scrawl/win32.py", "src/scrawl/shell.py", "src/scrawl/ui/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
